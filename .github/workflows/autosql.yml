name: autosql
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operator-kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install envtest asset manager
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20251218032627-56d9e70af999
      - name: Test operator against Kubernetes 1.35
        run: |
          KUBEBUILDER_ASSETS="$(setup-envtest use -p path 1.35.x)"
          export KUBEBUILDER_ASSETS
          AUTOSQL_OPERATOR_ENVTEST=1 go test -count=1 ./internal/operatorcontroller \
            -run TestEnvtestReconcilesCRAndWritesStatus
  changeset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out > coverage.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autosql-coverage
          path: |
            coverage.out
            coverage.txt
      - run: go vet ./...
      - run: go build ./...
  deploy:
    if: github.event_name == 'push'
    needs: changeset
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o autosql ./cmd/autosql
      - run: ./autosql version --json
