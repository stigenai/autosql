name: zero-downtime PostgreSQL matrix
on:
  pull_request:
  push:
    branches: [main]
jobs:
  postgres:
    strategy:
      fail-fast: false
      matrix:
        version: [14, 15, 16, 17, 18]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autosql
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d autosql"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AUTOSQL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/autosql?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/test-live-serial.sh ./pkg/zdm/... ./internal/cli
      - name: Test PostgreSQL default-expression matrix
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestDefaultExpressionMatrixAdoptProvisionAndIncrement$'
      - name: Test PostgreSQL managed-comment lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestManagedCommentLifecycleCreateApplyReinspect$'
      - name: Test PostgreSQL identity-column provisioning
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestIdentityColumnsCreateApplyReinspect$'
      - name: Test PostgreSQL generated dependency inspection
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestInspectURLIntegration$'
      - name: Test PostgreSQL generated routine prerequisites
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestGeneratedRoutinePrerequisiteVerification$'
      - name: Test PostgreSQL stored-generated provisioning
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestStoredGeneratedColumnCreateApplyReinspect$'
      - name: Test complete PostgreSQL cell provisioning parity
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestCompleteCellProvisioningParity$'
      - name: Test PostgreSQL constraint and index bootstrap parity
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestConstraintIndexBootstrapParity$'
      - name: Test PostgreSQL function lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestFunctionReplaceRenameDropLifecycle$'
      - name: Test PostgreSQL procedure lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestProcedureBootstrapReplaceParity$'
      - name: Test PostgreSQL trigger family lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestTriggerFamilyBootstrapParity$'
      - name: Test PostgreSQL concurrent index lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestConcurrentIndexCreateRebuildDropLifecycle$'
      - name: Test PostgreSQL count-bearing constraint/index inventory
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestConstraintIndexInventoryScaleParity$'
      - name: Test PostgreSQL count-bearing routine/trigger inventory
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestRoutineTriggerInventoryScaleParity$'
      - name: Test PostgreSQL RLS policy bootstrap inventory
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestRLSPolicyInventoryBootstrapParity$'
      - name: Test PostgreSQL role and write-only password lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestRoleLifecycleAndWriteOnlyPassword$'
      - name: Test PostgreSQL membership lifecycle and versioned options
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestMembershipLifecycleVersionParity$'
      - name: Test PostgreSQL exact grant inventory lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestGrantInventoryLifecycleParity$'
      - name: Test PostgreSQL future-object default privileges
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestDefaultPrivilegeFutureObjectParity$'
      - name: Test PostgreSQL extension catalog and lifecycle parity
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^(TestInspectExtensionCatalogURL|TestExtensionReadinessURLIsReadOnlyAndVersionAware|TestExtensionReadinessDetectsTrustedMemberOwnershipRelocationBlock|TestExtensionReadinessAcceptsInheritedOwnerUpdateAndMovePG18|TestBootstrapExtensionReadinessUsesServerTrustAndExplicitAuthority|TestExtensionCreateUpdateSchemaMoveAndGuardedDrop|TestExtensionOwnedMembersDoNotProduceDuplicateLifecycle|TestWholeDatabaseBootstrapExtensionReadinessFailsBeforeTargetMutation)$'
      - name: Test PostgreSQL composite-type model and lifecycle parity
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^(TestCompositeInspectHCLRoundTripPreservesOrderTypesAndCollation|TestCompositeCreateAttributeLifecycleRenameAndGuardedDrop)$'
      - name: Test managed and external database-target lifecycle
        run: scripts/test-live-serial.sh ./pkg/postgres -run '^TestManagedAndExternalDatabaseTargetLifecycle$'
      - name: Test semantic bootstrap fidelity and synthetic scale recovery
        run: scripts/test-live-serial.sh ./pkg/postgres -timeout 30m -run '^(TestSyntheticScaleBootstrapInventoryManifest|TestSemanticCellSignedDirectBootstrapInterruptionResume|TestSemanticCellCLISignedBootstrapAgainstNewPostgresDatabase|TestSemanticCellProductionOperatorSignedBootstrapAgainstNewPostgresDatabase|TestWholeDatabaseBootstrap)'
      - name: Test operator empty-database bootstrap reconciliation
        run: scripts/test-live-serial.sh ./pkg/operator -run '^TestOperatorWholeDatabaseBootstrapAgainstNewPostgresDatabase$'
      - name: Test production operator signed-artifact bootstrap
        run: scripts/test-live-serial.sh ./internal/operatorcontroller -run '^TestArtifactApplyCreatesFreshDatabaseAgainstPostgresWithRealSignatures$'
      - name: Test GitOps artifact publish through operator apply
        run: scripts/test-live-serial.sh ./internal/operatorcontroller -run '^TestGitOpsPublishBundleIsAcceptedAndAppliedByOperator$'
      - name: Benchmark complete bootstrap pipeline
        if: matrix.version == 16
        run: go test ./pkg/postgres -run '^$' -bench '^BenchmarkCompleteBootstrapPipeline$' -benchtime=3x -count=1 | tee bootstrap-bench.txt
      - name: Upload complete bootstrap benchmark
        if: matrix.version == 16
        uses: actions/upload-artifact@v4
        with:
          name: complete-bootstrap-postgres-16
          path: bootstrap-bench.txt
      - run: go test -race -p 1 -covermode=atomic -coverprofile=zdm-coverage.out -count=1 ./pkg/zdm/... ./internal/cli
      - run: go tool cover -func=zdm-coverage.out > zdm-coverage.txt
      - run: go test -run '^$' -bench BenchmarkZDM -benchtime=1s -count=1 ./pkg/zdm/compatmatrix | tee zdm-bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zdm-postgres-${{ matrix.version }}
          path: |
            zdm-bench.txt
            zdm-coverage.out
            zdm-coverage.txt
