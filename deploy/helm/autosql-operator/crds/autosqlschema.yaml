apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autosqlschemas.autosql.io
spec:
  group: autosql.io
  scope: Namespaced
  names:
    plural: autosqlschemas
    singular: autosqlschema
    kind: AutoSQLSchema
    shortNames: [asql]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Digest
          type: string
          jsonPath: .status.appliedDigest
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [kind, source]
              properties:
                kind: {type: string, enum: [DeclarativeSchema, VersionedMigration]}
                generation: {type: integer, format: int64, minimum: 1, default: 1}
                suspend: {type: boolean, default: false}
                adoptionPolicy: {type: string, enum: [IfEquivalent]}
                source:
                  type: object
                  minProperties: 1
                  maxProperties: 2
                  properties:
                    format: {type: string, enum: [sql, hcl]}
                    inline:
                      type: string
                      minLength: 1
                    secretRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: {type: string, minLength: 1, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'}
                        key: {type: string, minLength: 1, pattern: '^[A-Za-z0-9._-]+$'}
                    configMapRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: {type: string, minLength: 1, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'}
                        key: {type: string, minLength: 1, pattern: '^[A-Za-z0-9._-]+$'}
                    url: {type: string, minLength: 1, format: uri}
                    registryDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                  x-kubernetes-validations:
                    - rule: "(has(self.inline) ? 1 : 0) + (has(self.secretRef) ? 1 : 0) + (has(self.configMapRef) ? 1 : 0) + (has(self.url) ? 1 : 0) + (has(self.registryDigest) ? 1 : 0) == 1"
                      message: exactly one source variant must be set
                    - rule: "!has(self.format) || has(self.inline) || has(self.secretRef) || has(self.configMapRef)"
                      message: source format applies only to inline, Secret, or ConfigMap declarative content
                artifactDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                databaseURL:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string, minLength: 1, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'}
                    key: {type: string, minLength: 1, pattern: '^[A-Za-z0-9._-]+$'}
                databaseIdentity:
                  type: object
                  required: [provider, host, port, user, database, tlsMode, audience, subject]
                  properties:
                    provider: {type: string, enum: [aws_rds_iam, gcp_cloud_sql_iam, azure_postgresql_entra]}
                    host: {type: string, minLength: 1, maxLength: 253}
                    port: {type: integer, minimum: 1, maximum: 65535, default: 5432}
                    user: {type: string, minLength: 1}
                    database: {type: string, minLength: 1}
                    tlsMode: {type: string, enum: [require, verify-ca, verify-full], default: verify-full}
                    region: {type: string}
                    audience: {type: string, minLength: 1}
                    subject: {type: string}
                  x-kubernetes-validations:
                    - rule: "self.provider != 'aws_rds_iam' || (has(self.region) && self.region != '')"
                      message: AWS RDS IAM requires region
                maintenanceDatabaseURL:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string, minLength: 1, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'}
                    key: {type: string, minLength: 1, pattern: '^[A-Za-z0-9._-]+$'}
                databaseTarget:
                  type: object
                  required: [mode, endpoint, maintenanceDatabase, name, owner, connectionLimit, allowConnections]
                  properties:
                    mode: {type: string, enum: [managed, external]}
                    endpoint:
                      type: object
                      required: [host]
                      properties:
                        host: {type: string, minLength: 1}
                        port: {type: integer, minimum: 1, maximum: 65535, default: 5432}
                        tlsMode: {type: string, enum: [disable, require, verify-ca, verify-full], default: require}
                    maintenanceDatabase: {type: string, minLength: 1, default: postgres}
                    name: {type: string, minLength: 1}
                    owner: {type: string, minLength: 1}
                    encoding: {type: string, minLength: 1, default: UTF8}
                    localeProvider: {type: string, enum: [libc, icu, builtin]}
                    collation: {type: string}
                    characterType: {type: string}
                    icuLocale: {type: string}
                    template: {type: string, minLength: 1, default: template0}
                    tablespace: {type: string, minLength: 1, default: pg_default}
                    connectionLimit: {type: integer, minimum: -1}
                    allowConnections: {type: boolean}
                createDatabase: {type: boolean, default: false}
                postgresVersion: {type: integer, minimum: 14, maximum: 18}
                concurrentIndexes: {type: boolean, default: true}
                bootstrapAuthority:
                  type: object
                  required: [identities, assignments]
                  properties:
                    identities:
                      type: array
                      minItems: 1
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, subject, authentication, capabilities]
                        properties:
                          name: {type: string, minLength: 1}
                          subject: {type: string, minLength: 1}
                          authentication: {type: string, enum: [current_session, secret_reference, aws_irsa, oidc]}
                          credential:
                            type: object
                            required: [provider, name]
                            properties:
                              provider: {type: string, minLength: 1}
                              name: {type: string, minLength: 1}
                              key: {type: string, minLength: 1}
                          capabilities:
                            type: array
                            minItems: 1
                            x-kubernetes-list-type: set
                            items:
                              type: string
                              enum: [create_database, manage_roles, manage_extensions, manage_schema_objects, manage_grants, transfer_ownership]
                        x-kubernetes-validations:
                          - rule: "self.authentication == 'secret_reference' ? has(self.credential) : !has(self.credential)"
                            message: only secret_reference authentication requires a credential reference
                    assignments:
                      type: array
                      minItems: 1
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [responsibility]
                      items:
                        type: object
                        required: [responsibility, identity]
                        properties:
                          responsibility:
                            type: string
                            enum: [database_creation, role_creation, extension_setup, schema_objects, grant_setup, ownership_handoff]
                          identity: {type: string, minLength: 1}
                bootstrapAuthorization:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  required: [manifestSecretRef, publicKeySecretRef, issuer, signer, purpose]
                  properties:
                    manifestSecretRef:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      required: [name, key]
                      properties:
                        name: {type: string, minLength: 1, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'}
                        key: {type: string, minLength: 1, pattern: '^[A-Za-z0-9._-]+$'}
                    publicKeySecretRef:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      required: [name, key]
                      properties:
                        name: {type: string, minLength: 1, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'}
                        key: {type: string, minLength: 1, pattern: '^[A-Za-z0-9._-]+$'}
                    issuer: {type: string, minLength: 1, maxLength: 253}
                    signer: {type: string, minLength: 1, maxLength: 253}
                    purpose: {type: string, minLength: 1, maxLength: 253}
                  x-kubernetes-validations:
                    - rule: "self.manifestSecretRef.name != '' && self.manifestSecretRef.key != '' && self.publicKeySecretRef.name != '' && self.publicKeySecretRef.key != ''"
                      message: authorization manifest and public key runtime references must be complete
                requireApproval: {type: boolean}
              x-kubernetes-validations:
                - rule: "(has(self.databaseURL) ? 1 : 0) + (has(self.databaseIdentity) ? 1 : 0) == 1"
                  message: exactly one of databaseURL or databaseIdentity is required
                - rule: "self.generation >= 1"
                  message: generation must be at least 1
                - rule: "has(self.artifactDigest)"
                  message: operator migrations require artifactDigest
                - rule: "!has(self.source.registryDigest) || self.source.registryDigest == self.artifactDigest"
                  message: registryDigest must equal artifactDigest
                - rule: "!self.createDatabase || has(self.bootstrapAuthority)"
                  message: createDatabase requires bootstrapAuthority
                - rule: "!has(self.databaseTarget) || self.databaseTarget.mode != 'managed' || (has(self.bootstrapAuthority) && has(self.maintenanceDatabaseURL))"
                  message: managed databaseTarget requires bootstrapAuthority and maintenanceDatabaseURL
                - rule: "!self.createDatabase || !has(self.databaseTarget) || self.databaseTarget.mode == 'managed'"
                  message: createDatabase conflicts with external databaseTarget mode
                - rule: "!has(self.bootstrapAuthorization) || (self.kind == 'DeclarativeSchema' && has(self.databaseTarget) && (has(self.source.inline) || has(self.source.secretRef) || has(self.source.configMapRef)))"
                  message: bootstrapAuthorization requires databaseTarget and a controller-resolvable DeclarativeSchema source
                - rule: "!has(self.adoptionPolicy) || (self.adoptionPolicy == 'IfEquivalent' && self.kind == 'DeclarativeSchema' && (has(self.source.inline) || has(self.source.secretRef) || has(self.source.configMapRef)))"
                  message: adoptionPolicy requires a controller-resolvable DeclarativeSchema source
                - rule: "!has(self.adoptionPolicy) || (!self.createDatabase && !has(self.databaseTarget) && !has(self.maintenanceDatabaseURL) && !has(self.bootstrapAuthority) && !has(self.bootstrapAuthorization))"
                  message: adoptionPolicy cannot create or bootstrap a database
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64, minimum: 0}
                appliedDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                planDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                targetIdentity: {type: string, minLength: 1}
                operationID: {type: string, minLength: 1}
                recoveryState: {type: string, enum: [none, pending, uncertain, recovered]}
                executionID: {type: string, minLength: 1}
                pendingStep: {type: string, minLength: 1}
                recoveryGuidance: {type: string, minLength: 1}
                appliedSteps: {type: integer, minimum: 0}
                retryCount: {type: integer, minimum: 0}
                appliedFingerprint: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                authorizationExpiresAt: {type: string, format: date-time}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, observedGeneration, lastTransitionTime]
                    properties:
                      type: {type: string, enum: [Planning, ApprovalRequired, Applying, Ready, Failed, BootstrapAuthorization]}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      lastTransitionTime: {type: string, format: date-time}
      subresources: {status: {}}
