# Merge this scrape job into the existing in-cluster collector configuration.
# Its service account needs its existing permission to discover Pods.
# Select exactly one discovery job; do not also scrape the same Pods via Service.
scrape_configs:
  - job_name: autosql-operator
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [autosql-system]
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
          - __meta_kubernetes_pod_label_app
        regex: "autosql-operator;|;autosql-operator"
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
