apiVersion: apps/v1
kind: Deployment
metadata:
  name: autosql-operator
spec:
  replicas: 2
  selector: { matchLabels: { app: autosql-operator } }
  template:
    metadata: { labels: { app: autosql-operator } }
    spec:
      serviceAccountName: autosql-operator
      containers:
        - name: operator
          image: ghcr.io/stigenai/autosql@sha256:0e748a1c8fbc51c2bfbdf00be13bf0484d5c6f6be8b45612550ec211d4cd0905
          imagePullPolicy: IfNotPresent
          args:
            [
              "operator",
              "--leader-election",
              "--metrics-bind-address=:8080",
              "--health-probe-bind-address=:8081",
            ]
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: AUTOSQL_OPERATOR_STATE_FILE
              value: /var/lib/autosql/operator/state.json
            - name: AUTOSQL_OPERATOR_WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: operator-state
              mountPath: /var/lib/autosql
      volumes:
        - name: operator-state
          emptyDir: {}
