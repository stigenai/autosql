apiVersion: apps/v1
kind: Deployment
metadata:
  name: autosql-operator
spec:
  replicas: 2
  selector: {matchLabels: {app: autosql-operator}}
  template:
    metadata: {labels: {app: autosql-operator}}
    spec:
      serviceAccountName: autosql-operator
      containers:
        - name: operator
          image: ghcr.io/stigenai/autosql:latest
          imagePullPolicy: IfNotPresent
          args: ["operator", "--leader-election"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: AUTOSQL_OPERATOR_STATE_FILE
              value: /var/lib/autosql/operator/state.json
          volumeMounts:
            - name: operator-state
              mountPath: /var/lib/autosql
      volumes:
        - name: operator-state
          emptyDir: {}
