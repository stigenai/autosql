apiVersion: v1
kind: Service
metadata:
  name: autosql-operator-metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app: autosql-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
