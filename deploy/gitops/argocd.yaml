apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autosql-operator
  namespace: argocd
spec:
  project: default
  destination:
    namespace: autosql-system
    server: https://kubernetes.default.svc
  source:
    repoURL: ghcr.io/stigenai/charts
    chart: autosql-operator
    targetRevision: 0.1.0
    helm:
      valuesObject:
        image:
          repository: ghcr.io/stigenai/autosql
          digest: sha256:0e748a1c8fbc51c2bfbdf00be13bf0484d5c6f6be8b45612550ec211d4cd0905
  syncPolicy:
    syncOptions: [CreateNamespace=true]
