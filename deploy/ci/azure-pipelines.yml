stages:
  - stage: Review
    jobs:
      - job: AutoSQLReview
        steps:
          - task: AutoSQL@0
            inputs:
              mode: verify
              contract: .autosql/review-contract.json
              contractDigest: $(AUTOSQL_REVIEW_CONTRACT_DIGEST)
  - stage: Deploy
    dependsOn: Review
    jobs:
      - deployment: AutoSQLDeploy
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AutoSQL@0
                  inputs:
                    mode: run
                    contract: .autosql/deploy-contract.json
                    contractDigest: $(AUTOSQL_DEPLOY_CONTRACT_DIGEST)
