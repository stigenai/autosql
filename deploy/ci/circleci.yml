version: 2.1
orbs:
  autosql: stigenai/autosql@0.1.0
workflows:
  database:
    jobs:
      - autosql/review:
          contract: .autosql/review-contract.json
          contract-digest: ${AUTOSQL_REVIEW_CONTRACT_DIGEST}
      - autosql/deploy:
          context: autosql-production
          contract: .autosql/deploy-contract.json
          contract-digest: ${AUTOSQL_DEPLOY_CONTRACT_DIGEST}
          requires: [autosql/review]
          filters: {branches: {only: main}}
