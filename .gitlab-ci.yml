include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/autosql@${CI_COMMIT_SHA}
    inputs:
      stage: review
      mode: verify
      contract: .autosql/review-contract.json
      contract_digest: $AUTOSQL_REVIEW_CONTRACT_DIGEST
      image_digest: $AUTOSQL_IMAGE_DIGEST
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/autosql@${CI_COMMIT_SHA}
    inputs:
      stage: deploy
      mode: run
      contract: .autosql/deploy-contract.json
      contract_digest: $AUTOSQL_DEPLOY_CONTRACT_DIGEST
      image_digest: $AUTOSQL_IMAGE_DIGEST
stages: [review, deploy]
